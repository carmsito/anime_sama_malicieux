# Compose de PRODUCTION (utilisé par la CI/CD et sur le serveur).
# À lancer depuis le dossier deploy/ :  docker compose -f docker-compose.prod.yml up -d --build
# Les chemins de bind-mount sont relatifs à ce fichier → data persistante hors conteneur.
#
#   ../.env            → secrets (SECRET_KEY, TELEGRAM_*, …) — gitignoré
#   ../srv-data        → DB SQLite, covers, session Telegram (tg.session), cache EPUB
#   ../srv-extraction  → cache EPUB local (court-vécu quand Telegram activé)

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
      BGUTIL_BASE_URL: http://bgutil-provider:4416
      YT_EXTRACTOR_URL: http://yt-extractor:8080
      # Cache HuggingFace dans srv-data (monté) → le modèle de détection de cases persiste
      HF_HOME: /srv/app/api/data/hf_cache
    depends_on:
      - flaresolverr
      - bgutil-provider
    # Permet à la console admin de joindre l'HÔTE (SSH root) de façon fiable
    # depuis le conteneur : host.docker.internal → passerelle de l'hôte.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ../srv-data:/srv/app/api/data
      - ../srv-extraction:/srv/extraction
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Reverse-proxy HTTPS (Let's Encrypt auto) → débloque le PWA + la caméra (scanner QR).
  # Accès : https://62-238-63-117.nip.io  (l'accès direct http://IP:8000 reste dispo).
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Résout le managed challenge Cloudflare de Sushiscan (interne uniquement).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info

  # Génère les "PO tokens" (proof-of-origin) que YouTube exige → yt-dlp passe le bot
  # check de façon fiable même depuis une IP datacenter (playlist musique). Interne.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  # (Sidecar yt-extractor de la playlist musique : temporairement retiré — feature en
  # pause + disque plein. À réactiver quand on reprend la musique.)

volumes:
  caddy_data:     # certificats Let's Encrypt (persistants → pas de re-émission à chaque redéploiement)
  caddy_config:
