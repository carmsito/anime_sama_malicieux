# Déploiement single-box. L'API + les workers de jobs tournent dans le même
# conteneur (threads in-process du job_queue) → tant que le conteneur tourne, l'API
# et les jobs ne s'arrêtent jamais.
#
#   cp deploy/.env.example .env   # puis éditer
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Sushiscan résout Cloudflare via FlareSolverr (conteneur ci-dessous), puis
      # curl_cffi télécharge avec le cookie. 0 proxy, 0 navigateur côté app.
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
    depends_on:
      - flaresolverr
    ports:
      - "8000:8000"
    volumes:
      - appdata:/srv/app/api/data    # DB SQLite, covers, session Telegram
      - extraction:/srv/extraction   # cache EPUB local (court-vécu si Telegram activé)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # FlareSolverr : résout le managed challenge Cloudflare de Sushiscan et fournit
  # le cookie cf_clearance. Interne uniquement (pas exposé sur l'extérieur).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info

volumes:
  appdata:
  extraction:
