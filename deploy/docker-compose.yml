# Déploiement single-box (Oracle Cloud Always Free recommandé).
# L'API et les workers de jobs tournent dans le MÊME conteneur (les workers sont
# des threads in-process du job_queue) → tant que le conteneur tourne (always-on
# sur Oracle), l'API et les jobs ne s'arrêtent jamais.
#
#   cp deploy/.env.example .env   # puis éditer
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Passage à un worker séparé (scaling horizontal) : nécessiterait une file partagée
# (Redis) — non requis pour ~10 users, documenté dans deploy/README.md.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped          # redémarre tout seul → jamais "down"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - appdata:/srv/app/api/data    # DB SQLite, covers, session Telegram
      - extraction:/srv/extraction   # cache EPUB local (court-vécu si Telegram activé)
    shm_size: "1gb"                   # évite les crashs chromium (--disable-dev-shm-usage aussi géré)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/jobs'); "]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  appdata:
  extraction:
